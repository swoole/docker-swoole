name: Build Nightly Images

on:
  schedule:
    - cron: '47 9 * * *'
  workflow_dispatch:

# Jobs only read the repository by default; jobs that need more ask for it themselves.
permissions:
  contents: read

env:
  # The names of the platforms in the "platform" matrix below. The merge job publishes the images of the platforms
  # that built; for a platform that failed, bin/publish-image.sh keeps the image each tag already has, and fails the
  # job so that the run shows which platform is missing.
  PLATFORMS: "linux/amd64 linux/arm64/v8 linux/ppc64le linux/s390x"

# Each platform is built by its own job, on a runner of that architecture where GitHub offers one, and pushed to the
# registry by digest only. A final job joins those digests into one multi-architecture tag. Building linux/amd64 on
# an x86 runner instead of emulating it on the arm64 runners keeps it native, which is both faster and the only way
# the functional tests can run against it.
jobs:
  build:
    name: PHP ${{ matrix.php }} (${{ matrix.image.type }}) on ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runner }}
    if: github.repository == 'swoole/docker-swoole'
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
        image: [{type: "cli", postfix: ""}, {type: "zts", postfix: "-zts"}]
        # Keep "emulated" an unquoted YAML boolean: the steps below negate it, and a quoted "false" would
        # be a non-empty string, so the negation would silently turn every one of them off. Keep the names
        # in sync with PLATFORMS above.
        platform:
          - {name: "linux/amd64",    slug: "amd64",   runner: "ubuntu-24.04",     emulated: false}
          - {name: "linux/arm64/v8", slug: "arm64v8", runner: "ubuntu-24.04-arm", emulated: false}
          - {name: "linux/ppc64le",  slug: "ppc64le", runner: "ubuntu-24.04-arm", emulated: true}
          - {name: "linux/s390x",    slug: "s390x",   runner: "ubuntu-24.04-arm", emulated: true}

    steps:
      -
        name: Checkout
        uses: actions/checkout@v7

      -
        name: Set up QEMU
        if: matrix.platform.emulated
        uses: docker/setup-qemu-action@v4
        with:
          # Pinned because the default is "latest": a QEMU release could otherwise change how the emulated
          # architectures behave, or break them, with no commit in this repository. This is the image
          # "latest" resolved to when it was pinned.
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3

      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      -
        name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The functional tests run the image, so they are only meaningful on a runner of the same architecture. Emulated
      # platforms are covered by the assertion at the end of every Dockerfile, which fails the build if extension
      # Swoole cannot be loaded.
      -
        name: Build Docker image phpswoole/swoole:php${{ matrix.php }}${{ matrix.image.postfix }} for testing
        if: ${{ !matrix.platform.emulated }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: dockerfiles/nightly/php${{ matrix.php }}/${{ matrix.image.type }}/Dockerfile
          platforms: ${{ matrix.platform.name }}
          load: true
          push: false
          tags: phpswoole/swoole:test

      -
        name: Test Docker image phpswoole/swoole:php${{ matrix.php }}${{ matrix.image.postfix }}
        if: ${{ !matrix.platform.emulated }}
        run: ./bin/test-image.sh phpswoole/swoole:test

      -
        name: Read the base image of the Dockerfile
        id: base
        # The image is based on the last stage of the Dockerfile; the stages before it only prepare files for the build.
        run: echo "name=docker.io/library/$(awk 'toupper($1) == "FROM" { base = $2 } END { print base }' "dockerfiles/nightly/php${{ matrix.php }}/${{ matrix.image.type }}/Dockerfile")" >> "$GITHUB_OUTPUT"

      -
        name: Build and push Docker image phpswoole/swoole:php${{ matrix.php }}${{ matrix.image.postfix }} by digest
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: dockerfiles/nightly/php${{ matrix.php }}/${{ matrix.image.type }}/Dockerfile
          platforms: ${{ matrix.platform.name }}
          outputs: type=image,name=phpswoole/swoole,push-by-digest=true,name-canonical=true,push=true
          # An SBOM and full build provenance are attached to the image of each platform, and kept in the
          # multi-architecture index created by the merge job below.
          sbom: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.title=Swoole
            org.opencontainers.image.description=Official Docker image of Swoole
            org.opencontainers.image.url=https://hub.docker.com/r/phpswoole/swoole
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=nightly
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.base.name=${{ steps.base.outputs.name }}

      -
        name: Export the digest
        run: |
          set -ex
          : "${DIGEST:?the build step produced no digest}"
          mkdir -p /tmp/digests
          echo "${PLATFORM}" > "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.docker_build.outputs.digest }}
          PLATFORM: ${{ matrix.platform.name }}

      -
        name: Upload the digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-php${{ matrix.php }}-${{ matrix.image.type }}-${{ matrix.platform.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  # Joins the per-platform digests into the multi-architecture tag(s).
  merge:
    name: PHP ${{ matrix.php }} (${{ matrix.image.type }})
    needs: build
    permissions:
      contents: read
      # Lets cosign sign the published images keylessly, with the identity of this workflow run.
      id-token: write
    runs-on: ubuntu-24.04
    # Without "!cancelled()" a single failed build job would skip the whole merge matrix, so one flaky
    # emulated platform would stop every tag in the run from being published. A tag is still published when
    # one of its platforms failed to build: bin/publish-image.sh keeps the image the tag already has for that
    # platform, and fails the job so that the run shows the missing platform.
    if: ${{ !cancelled() && github.repository == 'swoole/docker-swoole' }}
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
        image: [{type: "cli", postfix: ""}, {type: "zts", postfix: "-zts"}]

    steps:
      -
        name: Checkout
        uses: actions/checkout@v7

      -
        name: Download the digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-php${{ matrix.php }}-${{ matrix.image.type }}-*
          merge-multiple: true

      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      -
        name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      -
        name: Install cosign
        # This action doesn't publish major-version tags (like "v4") since v3, so it's pinned to a release instead.
        uses: sigstore/cosign-installer@v4.1.2

      -
        name: Push Docker image phpswoole/swoole:php${{ matrix.php }}${{ matrix.image.postfix }}
        run: ./bin/publish-image.sh --version nightly --tag php${{ matrix.php }}${{ matrix.image.postfix }} /tmp/digests
