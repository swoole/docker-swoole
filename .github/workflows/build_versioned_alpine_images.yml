name: Build Versioned Alpine Images

on:
  push:
    branches:
      - '[4-9].[0-9]+.[0-9]+'
      # Pre-releases, named after their Git tags without the leading "v" (e.g. "6.3.0-rc1"); see
      # Dockerfile::isValidSwooleVersion().
      - '[4-9].[0-9]+.[0-9]+-alpha*'
      - '[4-9].[0-9]+.[0-9]+-beta*'
      - '[4-9].[0-9]+.[0-9]+-rc*'
      - '[4-9].[0-9]+.[0-9]+-RC*'

# Jobs only read the repository by default; jobs that need more ask for it themselves.
permissions:
  contents: read

env:
  # Number of entries in the "platform" matrix below. The merge job refuses to publish a tag unless it collected
  # exactly that many digests, so an architecture can never go missing from a published tag.
  EXPECTED_DIGESTS: 4

# Each platform is built by its own job, on a runner of that architecture where GitHub offers one, and pushed to the
# registry by digest only. A final job joins those digests into one multi-architecture tag. Building linux/amd64 on
# an x86 runner instead of emulating it on the arm64 runners keeps it native, which is both faster and the only way
# the functional tests can run against it.
jobs:
  build:
    name: PHP ${{ matrix.php }} (alpine) on ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runner }}
    if: github.repository == 'swoole/docker-swoole'
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4", "8.5"]
        # Keep "emulated" an unquoted YAML boolean: the steps below negate it, and a quoted "false" would
        # be a non-empty string, so the negation would silently turn every one of them off. Keep the number
        # of entries in sync with EXPECTED_DIGESTS above.
        platform:
          - {name: "linux/amd64",    slug: "amd64",   runner: "ubuntu-24.04",     emulated: false}
          - {name: "linux/arm64/v8", slug: "arm64v8", runner: "ubuntu-24.04-arm", emulated: false}
          - {name: "linux/ppc64le",  slug: "ppc64le", runner: "ubuntu-24.04-arm", emulated: true}
          - {name: "linux/s390x",    slug: "s390x",   runner: "ubuntu-24.04-arm", emulated: true}

    steps:
      -
        name: Checkout
        uses: actions/checkout@v7

      -
        name: Set up QEMU
        if: matrix.platform.emulated
        uses: docker/setup-qemu-action@v4
        with:
          # Pinned because the default is "latest": a QEMU release could otherwise change how the emulated
          # architectures behave, or break them, with no commit in this repository. This is the image
          # "latest" resolved to when it was pinned.
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3

      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      -
        name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      -
        name: Set output parameters
        id: params
        run: |
          set -ex

          branch_name=${GITHUB_REF##*/}
          echo "branch_name=${branch_name}" >> $GITHUB_OUTPUT

          # Not every Swoole version builds for every PHP version in the matrix (e.g., Swoole 6.1.x images are for
          # PHP 8.1 to PHP 8.4). Skip the build if no Dockerfile was generated for this combination.
          if [ ! -f "$(pwd)/dockerfiles/${branch_name}/php${{ matrix.php }}/alpine/Dockerfile" ] ; then
            echo "dockerfile_missing=true" >> $GITHUB_OUTPUT
          fi
          if ! egrep -q '^status\:\s*"under development"\s*($|\#)' "$(pwd)/config/${branch_name}.yml" ; then
            echo "released_already=true" >> $GITHUB_OUTPUT
          fi

      # The functional tests run the image, so they are only meaningful on a runner of the same architecture. Emulated
      # platforms are covered by the assertion at the end of every Dockerfile, which fails the build if extension
      # Swoole cannot be loaded.
      -
        name: Build Docker image phpswoole/swoole:${{ steps.params.outputs.branch_name }}-php${{ matrix.php }}-alpine for testing
        if: ${{ !matrix.platform.emulated && steps.params.outputs.released_already != 'true' && steps.params.outputs.dockerfile_missing != 'true' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: dockerfiles/${{ steps.params.outputs.branch_name }}/php${{ matrix.php }}/alpine/Dockerfile
          platforms: ${{ matrix.platform.name }}
          load: true
          push: false
          tags: phpswoole/swoole:test

      -
        name: Test Docker image phpswoole/swoole:${{ steps.params.outputs.branch_name }}-php${{ matrix.php }}-alpine
        if: ${{ !matrix.platform.emulated && steps.params.outputs.released_already != 'true' && steps.params.outputs.dockerfile_missing != 'true' }}
        run: ./bin/test-image.sh phpswoole/swoole:test

      -
        name: Read the base image of the Dockerfile
        id: base
        if: steps.params.outputs.released_already != 'true' && steps.params.outputs.dockerfile_missing != 'true'
        # The image is based on the last stage of the Dockerfile; the stages before it only prepare files for the build.
        run: echo "name=docker.io/library/$(awk 'toupper($1) == "FROM" { base = $2 } END { print base }' "dockerfiles/${{ steps.params.outputs.branch_name }}/php${{ matrix.php }}/alpine/Dockerfile")" >> "$GITHUB_OUTPUT"

      -
        name: Build and push Docker image phpswoole/swoole:${{ steps.params.outputs.branch_name }}-php${{ matrix.php }}-alpine by digest
        id: docker_build
        if: steps.params.outputs.released_already != 'true' && steps.params.outputs.dockerfile_missing != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: dockerfiles/${{ steps.params.outputs.branch_name }}/php${{ matrix.php }}/alpine/Dockerfile
          platforms: ${{ matrix.platform.name }}
          outputs: type=image,name=phpswoole/swoole,push-by-digest=true,name-canonical=true,push=true
          # An SBOM and full build provenance are attached to the image of each platform, and kept in the
          # multi-architecture index created by the merge job below.
          sbom: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.title=Swoole
            org.opencontainers.image.description=Official Docker image of Swoole
            org.opencontainers.image.url=https://hub.docker.com/r/phpswoole/swoole
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.params.outputs.branch_name }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.base.name=${{ steps.base.outputs.name }}

      -
        name: Export the digest
        if: steps.params.outputs.released_already != 'true' && steps.params.outputs.dockerfile_missing != 'true'
        run: |
          set -ex
          : "${DIGEST:?the build step produced no digest}"
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.docker_build.outputs.digest }}

      -
        name: Upload the digest
        if: steps.params.outputs.released_already != 'true' && steps.params.outputs.dockerfile_missing != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digests-php${{ matrix.php }}-alpine-${{ matrix.platform.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  # Joins the per-platform digests into the multi-architecture tag(s).
  merge:
    name: PHP ${{ matrix.php }} (alpine)
    needs: build
    permissions:
      contents: read
      # Lets cosign sign the published images keylessly, with the identity of this workflow run.
      id-token: write
    runs-on: ubuntu-24.04
    # Without "!cancelled()" a single failed build job would skip the whole merge matrix, so one flaky
    # emulated platform would stop every tag in the run from being published — the previous pipeline only
    # lost the tag it belonged to. The digest count checked below is what keeps that safe: a tag is still
    # never published from an incomplete set of platforms.
    if: ${{ !cancelled() && github.repository == 'swoole/docker-swoole' }}
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4", "8.5"]

    steps:
      -
        name: Checkout
        uses: actions/checkout@v7

      -
        name: Set output parameters
        id: params
        run: |
          set -ex

          branch_name=${GITHUB_REF##*/}
          echo "branch_name=${branch_name}" >> $GITHUB_OUTPUT

          if [ ! -f "$(pwd)/dockerfiles/${branch_name}/php${{ matrix.php }}/alpine/Dockerfile" ] ; then
            echo "dockerfile_missing=true" >> $GITHUB_OUTPUT
          fi
          if egrep -q '^status\:\s*"under development"\s*($|\#)' "$(pwd)/config/${branch_name}.yml" ; then
            major_version=${branch_name%.*}
            echo "major_version=${major_version}" >> $GITHUB_OUTPUT

            if [ ${{ matrix.php }} == '8.4' ] ; then
              if [ ${major_version} == '6.2' ] ; then
                echo "image_type=latest" >> $GITHUB_OUTPUT
              else
                echo "image_type=major" >> $GITHUB_OUTPUT
              fi
            else
              echo "image_type=default" >> $GITHUB_OUTPUT
            fi
          else
            echo "released_already=true" >> $GITHUB_OUTPUT
          fi

      -
        name: Download the digests
        if: steps.params.outputs.released_already != 'true' && steps.params.outputs.dockerfile_missing != 'true'
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-php${{ matrix.php }}-alpine-*
          merge-multiple: true

      # actions/download-artifact does not fail when its pattern matches only some of the expected artifacts, so
      # completeness is checked here: without it a tag could be republished with an architecture missing. This runs
      # before the registry login so that a short set fails cheaply, and before anything enters /tmp/digests, which
      # does not exist at all when no artifact matched.
      -
        name: Verify that every platform produced a digest
        if: steps.params.outputs.released_already != 'true' && steps.params.outputs.dockerfile_missing != 'true'
        run: |
          set -eu
          shopt -s nullglob
          digests=(/tmp/digests/*)
          if [ "${#digests[@]}" -ne "${EXPECTED_DIGESTS}" ] ; then
              echo "::error::expected ${EXPECTED_DIGESTS} digests, found ${#digests[@]}: ${digests[*]##*/}"
              exit 1
          fi

      -
        name: Set up Docker Buildx
        if: steps.params.outputs.released_already != 'true' && steps.params.outputs.dockerfile_missing != 'true'
        uses: docker/setup-buildx-action@v4

      -
        name: Login to DockerHub
        if: steps.params.outputs.released_already != 'true' && steps.params.outputs.dockerfile_missing != 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The floating tags depend on the image type: "default" images only get the two version-specific tags, "major"
      # images also get the tag for their minor series, and the "latest" image gets that plus the bare "latest" tag.
      -
        name: Install cosign
        if: steps.params.outputs.released_already != 'true' && steps.params.outputs.dockerfile_missing != 'true'
        # This action doesn't publish major-version tags (like "v4") since v3, so it's pinned to a release instead.
        uses: sigstore/cosign-installer@v4.1.2

      -
        name: Push Docker image phpswoole/swoole:${{ steps.params.outputs.branch_name }}-php${{ matrix.php }}-alpine (${{ steps.params.outputs.image_type }})
        if: steps.params.outputs.released_already != 'true' && steps.params.outputs.dockerfile_missing != 'true'
        working-directory: /tmp/digests
        env:
          BRANCH_NAME: ${{ steps.params.outputs.branch_name }}
          MAJOR_VERSION: ${{ steps.params.outputs.major_version }}
          IMAGE_TYPE: ${{ steps.params.outputs.image_type }}
          POSTFIX: "-alpine"
        run: |
          set -ex

          tags=(
              "${BRANCH_NAME}-php${{ matrix.php }}${POSTFIX}"
              "${MAJOR_VERSION}-php${{ matrix.php }}${POSTFIX}"
          )
          if [ "${IMAGE_TYPE}" = 'major' ] || [ "${IMAGE_TYPE}" = 'latest' ] ; then
              tags+=( "${MAJOR_VERSION}${POSTFIX}" )
          fi
          if [ "${IMAGE_TYPE}" = 'latest' ] ; then
              tags+=( "latest${POSTFIX}" )
          fi

          docker buildx imagetools create \
              --annotation "index:org.opencontainers.image.title=Swoole" \
              --annotation "index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
              --annotation "index:org.opencontainers.image.revision=${{ github.sha }}" \
              --annotation "index:org.opencontainers.image.version=${{ steps.params.outputs.branch_name }}" \
              --annotation "index:org.opencontainers.image.licenses=Apache-2.0" \
              $(printf -- '--tag phpswoole/swoole:%s ' "${tags[@]}") \
              $(printf 'phpswoole/swoole@sha256:%s ' *)
          docker buildx imagetools inspect "phpswoole/swoole:${tags[0]}"

          # Sign the multi-architecture index, which all the tags above point to.
          digest=$(docker buildx imagetools inspect "phpswoole/swoole:${tags[0]}" --format '{{ .Manifest.Digest }}')
          cosign sign --yes "phpswoole/swoole@${digest}"
